name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            echo "--- Navigating to project directory ---"
            cd /home/deployer/finance-app

            echo "--- Resetting local git modifications ---"
            git checkout -- .

            echo "--- Pulling latest code ---"
            git pull origin main

            echo "--- Building Frontend ---"
            cd /home/deployer/finance-app/finance_automation/frontend
            rm -rf build
            npm install
            npm run build

            echo "--- Updating Backend Dependencies ---"
            cd /home/deployer/finance-app/finance_automation/backend
            source /home/deployer/finance-app/finance_automation/venv/bin/activate
            pip install -r requirements.txt

            echo "--- Restarting Services ---"
            sudo systemctl restart finance-backend
            sudo systemctl reload nginx

            echo "--- Deployment Complete ---"
